<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cute Tamagotchi</title>

<style>
body {
  margin: 0;
  background: linear-gradient(180deg,#1e1e3f,#101025);
  font-family: 'Courier New', monospace;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.game {
  width: 380px;
  background: #1b1b33;
  border-radius: 30px;
  padding: 20px;
  box-shadow: 0 0 30px rgba(120,120,255,0.4);
  text-align: center;
}

.pet-container {
  height: 180px;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: transform 0.5s;
}

.pet {
  width: 120px;
  height: 120px;
  background: #ffb6d9;
  border-radius: 50% 50% 45% 45%;
  position: relative;
  transition: transform 0.5s;
}

/* ears */
.pet::before, .pet::after {
  content: "";
  width: 40px;
  height: 50px;
  background: #ffb6d9;
  position: absolute;
  top: -30px;
  border-radius: 50%;
}

.pet::before { left: 10px; }
.pet::after { right: 10px; }

/* eyes */
.eye {
  width: 18px;
  height: 18px;
  background: black;
  border-radius: 50%;
  position: absolute;
  top: 45px;
}

.eye.left { left: 35px; }
.eye.right { right: 35px; }

/* mouth */
.mouth {
  width: 25px;
  height: 15px;
  border-bottom: 3px solid black;
  border-radius: 50%;
  position: absolute;
  top: 70px;
  left: 50%;
  transform: translateX(-50%);
}

.stats {
  margin-top: 10px;
  font-size: 14px;
}

button {
  margin: 4px;
  padding: 6px 10px;
  border-radius: 12px;
  border: none;
  background: #6c63ff;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #837dff;
}

.poop {
  display: none;
  font-size: 22px;
}

#miniGame {
  display: none;
  margin-top: 15px;
}

canvas {
  background: #0f0f1f;
  border-radius: 15px;
}
</style>
</head>
<body>

<div class="game">

  <div class="pet-container" id="petContainer">
    <div class="pet" id="pet">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="mouth"></div>
    </div>
  </div>

  <div class="poop" id="poop">💩</div>

  <div class="stats">
    Hunger: <span id="hunger"></span><br>
    Energy: <span id="energy"></span><br>
    Health: <span id="health"></span><br>
    Happiness: <span id="happiness"></span><br>
    Age: <span id="age"></span>
  </div>

  <div>
    <button onclick="feed()">Feed</button>
    <button onclick="sleepPet()">Sleep</button>
    <button onclick="toilet()">Toilet</button>
    <button onclick="doctor()">Doctor</button>
    <button onclick="togglePause()">Pause</button>
    <button onclick="startMiniGame()">Hoop Game</button>
  </div>

  <div id="miniGame">
    <canvas id="gameCanvas" width="300" height="200"></canvas><br>
    <button onclick="endMiniGame()">Exit Game</button>
  </div>

</div>

<script>
let state = {
  paused:false,
  alive:true,
  hunger:50,
  energy:50,
  health:100,
  happiness:50,
  age:0,
  ageProgress:0,
  size:1,
  poopReady:false,
  lastMeal:0,
  doctorCooldown:0
};

function save(){ localStorage.setItem("petSave",JSON.stringify(state)); }
function load(){
  let data = localStorage.getItem("petSave");
  if(data) state = JSON.parse(data);
}
load();

function updateUI(){
  hunger.innerText = state.hunger;
  energy.innerText = state.energy;
  health.innerText = state.health;
  happiness.innerText = state.happiness;
  age.innerText = state.age;
  poop.style.display = state.poopReady ? "block":"none";
  pet.style.transform = "scale("+state.size+")";
}

setInterval(()=>{
  if(state.paused || !state.alive) return;

  state.hunger = Math.min(100,state.hunger+1);
  state.energy = Math.max(0,state.energy-1);

  if(state.hunger>80) state.health--;
  if(state.energy<10) state.health--;

  if(state.health<=0) state.alive=false;

  if(state.lastMeal && Date.now()-state.lastMeal>60000)
    state.poopReady=true;

  if(state.doctorCooldown>0) state.doctorCooldown--;

  updateUI();
  save();
},5000);

setInterval(()=>{
  if(state.paused||!state.alive) return;
  state.ageProgress++;
  if(state.ageProgress>=600){
    state.age++;
    state.ageProgress=0;
    state.size=1+state.age*0.15;
  }
},1000);

function feed(){
  if(!state.alive||state.paused)return;
  state.hunger=Math.max(0,state.hunger-20);
  state.happiness=Math.min(100,state.happiness+5);
  state.lastMeal=Date.now();
}

function sleepPet(){
  if(!state.alive||state.paused)return;
  let sleepInt=setInterval(()=>{
    if(state.energy>=100){clearInterval(sleepInt);return;}
    state.energy+=2;
    state.happiness+=1;
    updateUI();
  },1000);
}

function toilet(){
  if(!state.poopReady)return;
  state.poopReady=false;
  state.happiness+=8;
}

function doctor(){
  if(state.doctorCooldown>0)return;
  state.health=Math.min(100,state.health+40);
  state.happiness-=10;
  state.doctorCooldown=30;
}

function togglePause(){ state.paused=!state.paused; }

/* MINI GAME */
let canvas=document.getElementById("gameCanvas");
let ctx=canvas.getContext("2d");
let ballY=0,score=0,gameInterval;

function startMiniGame(){
  document.getElementById("miniGame").style.display="block";
  ballY=0; score=0;
  gameInterval=setInterval(()=>{
    ctx.clearRect(0,0,300,200);
    ctx.fillStyle="orange";
    ctx.fillRect(130,170,40,10); // hoop
    ctx.beginPath();
    ctx.arc(150,ballY,8,0,Math.PI*2);
    ctx.fillStyle="white";
    ctx.fill();
    ballY+=5;
    if(ballY>200){
      if(ballY>170 && ballY<190){
        state.happiness+=15;
      } else {
        state.happiness+=2;
      }
      state.energy-=2;
      ballY=0;
    }
  },30);
}

function endMiniGame(){
  clearInterval(gameInterval);
  document.getElementById("miniGame").style.display="none";
}

updateUI();
</script>
</body>
</html>
